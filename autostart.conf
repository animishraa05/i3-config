# made by ani - Lightweight autostart

# Environment setup (makes apps load as fast as terminal)
exec --no-startup-id export PATH="/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:$HOME/.local/bin"

# xorg settings
exec xrandr -s 1920x1080 -r 60
exec xset s -dpms
exec xset s off

# Touchpad settings
exec --no-startup-id xinput set-prop "ELAN0504:01 04F3:3091 Touchpad" "libinput Tapping Enabled" 1
exec --no-startup-id xinput set-prop "ELAN0504:01 04F3:3091 Touchpad" "libinput Natural Scrolling Enabled" 1
exec --no-startup-id xinput set-prop "DELL0A36:00 06CB:CE65 Touchpad" "libinput Tapping Enabled" 1

# Notification Daemon
exec dunst

# Polybar
exec_always --no-startup-id ~/.config/polybar/launch.sh
exec_always --no-startup-id variety

# Network applet
exec nm-applet

# Polkit authentication agent (single instance)
exec --no-startup-id /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec --no-startup-id xinput disable "DELL0A36:00 06CB:CE65 Touchpad"
# Caps to Escape
exec setxkbmap -option caps:escape

# awww wallpaper daemon (restores last wallpaper on startup)
