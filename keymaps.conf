# made by ani
# variables
set $mod Mod4
set $browser zen-browser
set $terminal kitty
set $filemanager yazi
set $pdfreader sioyek
set $scriptsdir ~/.config/i3/scripts

floating_modifier $mod

set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"

# Workspace switching
bindsym $mod+1    workspace  $ws1
bindsym $mod+2    workspace  $ws2
bindsym $mod+3    workspace  $ws3
bindsym $mod+4    workspace  $ws4
bindsym $mod+5    workspace  $ws5
bindsym $mod+6    workspace  $ws6
bindsym $mod+7    workspace  $ws7
bindsym $mod+8    workspace  $ws8

# Move focused container to workspace
bindsym $mod+Shift+1    move container to workspace  $ws1
bindsym $mod+Shift+2    move container to workspace  $ws2
bindsym $mod+Shift+3    move container to workspace  $ws3
bindsym $mod+Shift+4    move container to workspace  $ws4
bindsym $mod+Shift+5    move container to workspace  $ws5
bindsym $mod+Shift+6    move container to workspace  $ws6
bindsym $mod+Shift+7    move container to workspace  $ws7
bindsym $mod+Shift+8    move container to workspace  $ws8

# App shortcuts
bindsym $mod+y exec kitty -e yazi 
bindsym $mod+Return exec $terminal
bindsym $mod+w exec ~/.config/scripts/wallpaper_picker.sh
bindsym $mod+n exec $filemanager
bindsym $mod+Shift+o exec $pdfreader
bindsym $mod+B exec $browser

# Screenshots
bindsym $mod+p           exec $scriptsdir/screenshot.sh select
bindsym $mod+Shift+p     exec $scriptsdir/screenshot.sh full
bindsym $mod+Ctrl+p      exec $scriptsdir/screenshot.sh window
bindsym $mod+Alt+p       exec $scriptsdir/screenshot.sh clip-select
bindsym $mod+F8          exec $scriptsdir/screenshot.sh record

# Rofi App Launcher (drun mode - shows only apps)
bindsym $mod+d exec env DESKTOP_STARTUP_ID="" rofi -show drun -config ~/.config/rofi/main_menu.rasi

# Lock the system
bindsym $mod+Shift+x exec betterlockscreen -l

# Power Menu
bindsym $mod+Shift+e exec ~/.config/rofi/power_menu.sh

# reload the configuration file
bindsym $mod+Shift+c reload

# restart i3 inplace (preserves your layout/session, can be used to update i3)
bindsym $mod+Shift+r restart

# kill focused window
# qutebrowser gets a clean quit so its session is saved for the next launch
bindsym $mod+q exec /home/ani/.config/i3/scripts/smart-kill.sh

# Switch Active Workspaces
bindsym $mod+Tab workspace next
bindsym Mod1+Tab workspace prev



# split in horizontal orientation
bindsym $mod+z split h

# split in vertical orientation
bindsym $mod+Shift+v split v

# Open today's article (Obsidian vault)
bindsym $mod+a exec ~/.config/article-pipeline/scripts/open_article.sh --rofi

# enter fullscreen mode for the focused container
bindsym $mod+m fullscreen toggle

# toggle tiling / floating
bindsym $mod+space floating toggle ; [floating] resize set 1200 800 ; move position center

# change focus between tiling / floating windows
bindsym $mod+Shift+q focus mode_toggle

# focus the parent container
bindsym $mod+u focus parent

# change container layout (stacked, tabbed, toggle split)
# $mod+e used to be `layout tabbed`, which stacked every window into a
# single tab strip and made the desktop look frozen. Use stacking instead,
# or $mod+t to toggle back to a split.
bindsym $mod+e layout stacking
bindsym $mod+t layout toggle split

# Focus Changing
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

# move focused window
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

# resize window
bindsym $mod+Ctrl+h resize grow width 5 px or 5 ppt
bindsym $mod+Ctrl+j resize shrink height 5 px or 5 ppt
bindsym $mod+Ctrl+k resize grow height 5 px or 5 ppt
bindsym $mod+Ctrl+l resize shrink width 5 px or 5 ppt

# Funtions Keys
# Brightness
bindsym XF86MonBrightnessUp exec brightnessctl set +5%
bindsym XF86MonBrightnessDown exec brightnessctl set 5%-
# Pulse Audio controls
bindsym XF86AudioRaiseVolume exec pactl set-sink-volume 0 +5% 
bindsym XF86AudioLowerVolume exec pactl set-sink-volume 0 -5% 
bindsym XF86AudioMute exec pactl set-sink-mute 0 toggle


# Media player controls
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioPause exec playerctl play-pause
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPrev exec playerctl previous

# White noise
bindsym $mod+Shift+m exec ~/.config/i3/scripts/whitenoise.sh
bindsym $mod+Shift+Up exec ~/.config/i3/scripts/whitenoise-ctl.py up
bindsym $mod+Shift+Down exec ~/.config/i3/scripts/whitenoise-ctl.py down

# Scratchpad
# Move the currently focused window to the scratchpad
bindsym $mod+Shift+minus move scratchpad

# Show the next scratchpad window or hide the currently focused scratchpad window.
bindsym $mod+minus scratchpad show
